[project]
name = "baraholka-naukma"
version = "1.0.0"
description = "Baraholka NaUKMA — маркетплейс студентських оголошень"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    venv
  | \.venv
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = []

[tool.mutmut]
paths_to_mutate = "src/services/listings.py"
runner = "python -m pytest -q --tb=short tests/test_listing_service.py"
tests_dir = "tests/"
backup = false
