  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Отримати поточного користувача
      operationId: me_api_v1_auth_me_get
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Local user is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Entra ID not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Завершити локальну сесію
      operationId: logout_api_v1_auth_logout_post
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/listings/{listing_id}/withdraw:
    post:
      tags:
      - Moderation
      summary: Зняти чуже оголошення з публікації (модерація)
      description: Адміністратор знімає активне оголошення з обов'язковою причиною
        (FR-011). Оголошення переходить у WITHDRAWN, зникає з каталогу та обраного,
        а в журналі модерації створюється незмінний запис. Фізичного видалення немає.
      operationId: withdraw_listing_api_v1_admin_listings__listing_id__withdraw_post
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationWithdrawRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationActionResponse'
        '401':
          description: Немає валідної сесії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Немає ролі ADMIN або обліковий запис заблоковано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Оголошення не існує або вже зняте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /health:
    get:
      tags:
      - System
      summary: Перевірка працездатності API (Health Check)
      description: Системний ендпоінт для моніторингу працездатності сервісу, перевірки
        доступності та конвеєрів CI/CD.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
