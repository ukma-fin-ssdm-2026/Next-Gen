openapi: 3.1.0
info:
  title: Baraholka NaUKMA API
  description: REST API для маркетплейсу студентських оголошень Києво-Могилянської
    академії (Baraholka NaUKMA). Розроблено за підходом Code-First.
  version: 1.0.0
paths:
  /api/v1/listings:
    get:
      tags:
      - Listings
      summary: Отримати список оголошень (публічний)
      description: Повертає активні оголошення з пагінацією, фільтром категорії, діапазоном
        ціни та текстовим пошуком (FR-006, FR-007, FR-008). Контакт продавця не включається.
      operationId: get_listings_api_v1_listings_get
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Кількість пропущених записів
          default: 0
          title: Skip
        description: Кількість пропущених записів
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Розмір сторінки
          default: 10
          title: Limit
        description: Розмір сторінки
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Фільтр за категорією
          title: Category Id
        description: Фільтр за категорією
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 100
          - type: 'null'
          description: Пошук за назвою та описом
          title: Q
        description: Пошук за назвою та описом
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Мінімальна ціна
          title: Min Price
        description: Мінімальна ціна
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Максимальна ціна
          title: Max Price
        description: Максимальна ціна
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ListingSortOrder'
          description: 'Порядок за датою публікації: newest або oldest'
          default: newest
        description: 'Порядок за датою публікації: newest або oldest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingPublicResponse'
                title: Response Get Listings Api V1 Listings Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Listings
      summary: Створити оголошення
      description: Створює оголошення від імені X-Actor-Id із підтримкою фотографій
        та стану товару (FR-002). Повертає об'єкт з контактами.
      operationId: create_listing_api_v1_listings_post
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
            Сервер не приймає user_id з тіла запиту.
          title: X-Actor-Id
        description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
          Сервер не приймає user_id з тіла запиту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/listings/my:
    get:
      tags:
      - Listings
      summary: Отримати історію власних оголошень продавця
      description: Повертає перелік активних і знятих з публікації оголошень поточного
        користувача з відповідним статусом кожного оголошення (FR-005).
      operationId: get_my_listings_api_v1_listings_my_get
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
            Сервер не приймає user_id з тіла запиту.
          title: X-Actor-Id
        description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
          Сервер не приймає user_id з тіла запиту.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingResponse'
                title: Response Get My Listings Api V1 Listings My Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/listings/{listing_id}:
    get:
      tags:
      - Listings
      summary: Отримати оголошення за ID (публічне)
      description: Деталі активного оголошення без контактів.
      operationId: get_listing_api_v1_listings__listing_id__get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPublicResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Listings
      summary: Частково оновити оголошення
      description: Оновлює лише оголошення поточного користувача (заголовок X-Actor-Id).
      operationId: update_listing_api_v1_listings__listing_id__patch
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
            Сервер не приймає user_id з тіла запиту.
          title: X-Actor-Id
        description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
          Сервер не приймає user_id з тіла запиту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPublicResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Listings
      summary: Видалити оголошення
      description: Знімає оголошення з публікації (переводить у WITHDRAWN, FR-004).
        Виконується лише власником.
      operationId: delete_listing_api_v1_listings__listing_id__delete
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
            Сервер не приймає user_id з тіла запиту.
          title: X-Actor-Id
        description: Тимчасовий ідентифікатор користувача до впровадження JWT (ADR-003).
          Сервер не приймає user_id з тіла запиту.
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - System
      summary: Перевірка працездатності API (Health Check)
      description: Системний ендпоінт для моніторингу працездатності сервісу, перевірки
        доступності та конвеєрів CI/CD.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Опис помилки
          examples:
          - Оголошення не знайдено
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          type: array
          title: Detail
          description: Список помилок валідації
      type: object
      required:
      - detail
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Статус доступності сервісу
          examples:
          - ok
        app:
          type: string
          title: App
          description: Назва застосунку
          examples:
          - Baraholka NaUKMA API
        version:
          type: string
          title: Version
          description: Поточна версія API
          examples:
          - 1.0.0
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Час серверної перевірки
      type: object
      required:
      - status
      - app
      - version
      - timestamp
      title: HealthResponse
    ListingCondition:
      type: string
      enum:
      - NEW
      - LIKE_NEW
      - GOOD
      - USED
      title: ListingCondition
      description: Стан товару в оголошенні згідно з моделлю даних (FR-002).
    ListingCreate:
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 3
          title: Title
          description: Назва оголошення
          examples:
          - Худі з логотипом НаУКМА
        description:
          type: string
          maxLength: 2000
          minLength: 10
          title: Description
          description: Детальний опис товару
          examples:
          - Худі в ідеальному стані, розмір M. Продаю, бо не ношу.
        price:
          type: number
          minimum: 0.0
          title: Price
          description: Ціна в гривнях
          examples:
          - 150.0
        category_id:
          type: string
          format: uuid
          title: Category Id
          description: ID категорії
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        condition:
          $ref: '#/components/schemas/ListingCondition'
          description: Стан товару (NEW, LIKE_NEW, GOOD, USED)
          default: GOOD
          examples:
          - GOOD
        contact:
          type: string
          maxLength: 200
          minLength: 3
          title: Contact
          description: Контактні дані (пошта або Telegram)
          examples:
          - '@student_ukma'
        image_urls:
          items:
            type: string
          type: array
          maxItems: 10
          title: Image Urls
          description: URL фотографій оголошення (до 10 зображень)
          examples:
          - - https://baraholka.ukma.edu.ua/images/hoodie-naukma.jpg
      type: object
      required:
      - title
      - description
      - price
      - category_id
      - contact
      title: ListingCreate
    ListingImageResponse:
      properties:
        image_id:
          type: string
          format: uuid
          title: Image Id
          description: Унікальний ідентифікатор зображення
        image_url:
          type: string
          title: Image Url
          description: URL або шлях до збереженого зображення
          examples:
          - https://baraholka.ukma.edu.ua/images/hoodie-naukma.jpg
        display_order:
          type: integer
          minimum: 0.0
          title: Display Order
          description: Порядок відображення зображення
          examples:
          - 0
      type: object
      required:
      - image_id
      - image_url
      - display_order
      title: ListingImageResponse
    ListingPublicResponse:
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 3
          title: Title
          description: Назва оголошення
          examples:
          - Худі з логотипом НаУКМА
        description:
          type: string
          maxLength: 2000
          minLength: 10
          title: Description
          description: Детальний опис товару
          examples:
          - Худі в ідеальному стані, розмір M. Продаю, бо не ношу.
        price:
          type: number
          minimum: 0.0
          title: Price
          description: Ціна в гривнях
          examples:
          - 150.0
        category_id:
          type: string
          format: uuid
          title: Category Id
          description: ID категорії
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        condition:
          $ref: '#/components/schemas/ListingCondition'
          description: Стан товару (NEW, LIKE_NEW, GOOD, USED)
          default: GOOD
          examples:
          - GOOD
        id:
          type: string
          format: uuid
          title: Id
          description: Унікальний ідентифікатор оголошення
        user_id:
          type: string
          format: uuid
          title: User Id
          description: ID автора
        status:
          type: string
          title: Status
          description: Статус оголошення
          examples:
          - ACTIVE
        images:
          items:
            $ref: '#/components/schemas/ListingImageResponse'
          type: array
          title: Images
          description: Список фотографій оголошення
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Дата створення
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Дата останнього оновлення
      type: object
      required:
      - title
      - description
      - price
      - category_id
      - id
      - user_id
      - status
      - created_at
      - updated_at
      title: ListingPublicResponse
    ListingResponse:
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 3
          title: Title
          description: Назва оголошення
          examples:
          - Худі з логотипом НаУКМА
        description:
          type: string
          maxLength: 2000
          minLength: 10
          title: Description
          description: Детальний опис товару
          examples:
          - Худі в ідеальному стані, розмір M. Продаю, бо не ношу.
        price:
          type: number
          minimum: 0.0
          title: Price
          description: Ціна в гривнях
          examples:
          - 150.0
        category_id:
          type: string
          format: uuid
          title: Category Id
          description: ID категорії
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        condition:
          $ref: '#/components/schemas/ListingCondition'
          description: Стан товару (NEW, LIKE_NEW, GOOD, USED)
          default: GOOD
          examples:
          - GOOD
        id:
          type: string
          format: uuid
          title: Id
          description: Унікальний ідентифікатор оголошення
        user_id:
          type: string
          format: uuid
          title: User Id
          description: ID автора
        status:
          type: string
          title: Status
          description: Статус оголошення
          examples:
          - ACTIVE
        images:
          items:
            $ref: '#/components/schemas/ListingImageResponse'
          type: array
          title: Images
          description: Список фотографій оголошення
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Дата створення
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Дата останнього оновлення
        contact:
          type: string
          title: Contact
          description: Контактні дані (пошта або Telegram)
      type: object
      required:
      - title
      - description
      - price
      - category_id
      - id
      - user_id
      - status
      - created_at
      - updated_at
      - contact
      title: ListingResponse
    ListingSortOrder:
      type: string
      enum:
      - newest
      - oldest
      title: ListingSortOrder
      description: Порядок сортування каталогу за датою публікації (FR-008).
    ListingUpdate:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 3
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 10
          - type: 'null'
          title: Description
        price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Price
        contact:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 3
          - type: 'null'
          title: Contact
        condition:
          anyOf:
          - $ref: '#/components/schemas/ListingCondition'
          - type: 'null'
        image_urls:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 10
          - type: 'null'
          title: Image Urls
      type: object
      title: ListingUpdate
    ValidationErrorDetail:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Loc
          description: Розташування поля помилки
          examples:
          - - query
            - min_price
        msg:
          type: string
          title: Msg
          description: Повідомлення про помилку
          examples:
          - min_price (200.0) не може перевищувати max_price (100.0)
        type:
          type: string
          title: Type
          description: Тип валідаційної помилки
          examples:
          - value_error
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationErrorDetail
