openapi: 3.1.0
info:
  title: Baraholka NaUKMA API
  description: REST API для маркетплейсу студентських оголошень Києво-Могилянської
    академії (Baraholka NaUKMA). Розроблено за підходом Code-First.
  version: 1.0.0
paths:
  /api/v1/listings/images:
    post:
      tags:
      - Listings
      summary: Завантажити фотографії оголошення
      description: Приймає від 1 до 10 файлів через multipart/form-data, перевіряє
        фактичне декодування (JPEG, PNG, WebP, HEIC/HEIF), видаляє метадані (EXIF/GPS/XMP),
        оптимізує розмір (до 1600 px) та створює thumbnail (до 400 px) у WebP quality=80
        (FR-002, TM-03, TM-08).
      operationId: upload_listing_images_api_v1_listings_images_post
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_listing_images_api_v1_listings_images_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadedImageResponse'
                title: Response Upload Listing Images Api V1 Listings Images Post
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/listings:
    get:
      tags:
      - Listings
      summary: Отримати список оголошень (публічний)
      description: Повертає активні оголошення з пагінацією, фільтром категорії, діапазоном
        ціни та текстовим пошуком (FR-006, FR-007, FR-008). Контакт продавця не включається.
      operationId: get_listings_api_v1_listings_get
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Кількість пропущених записів
          default: 0
          title: Skip
        description: Кількість пропущених записів
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Розмір сторінки
          default: 10
          title: Limit
        description: Розмір сторінки
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Фільтр за категорією
          title: Category Id
        description: Фільтр за категорією
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 100
          - type: 'null'
          description: Пошук за назвою та описом
          title: Q
        description: Пошук за назвою та описом
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Мінімальна ціна
          title: Min Price
        description: Мінімальна ціна
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Максимальна ціна
          title: Max Price
        description: Максимальна ціна
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ListingSortOrder'
          description: 'Порядок за датою публікації: newest або oldest'
          default: newest
        description: 'Порядок за датою публікації: newest або oldest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingPublicResponse'
                title: Response Get Listings Api V1 Listings Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
    post:
      tags:
      - Listings
      summary: Створити оголошення
      description: Створює оголошення від імені автентифікованого користувача із підтримкою
        фотографій та стану товару (FR-002). Повертає об'єкт з контактами.
      operationId: create_listing_api_v1_listings_post
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /api/v1/listings/my:
    get:
      tags:
      - Listings
      summary: Отримати історію власних оголошень продавця
      description: Повертає перелік активних і знятих з публікації оголошень поточного
        користувача з відповідним статусом кожного оголошення (FR-005).
      operationId: get_my_listings_api_v1_listings_my_get
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingPublicResponse'
                title: Response Get My Listings Api V1 Listings My Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /api/v1/listings/{listing_id}:
    get:
      tags:
      - Listings
      summary: Отримати оголошення за ID (публічне)
      description: Деталі активного оголошення без контактів.
      operationId: get_listing_api_v1_listings__listing_id__get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPublicResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
    patch:
      tags:
      - Listings
      summary: Частково оновити оголошення
      description: Оновлює лише оголошення поточного користувача (FR-003).
      operationId: update_listing_api_v1_listings__listing_id__patch
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPublicResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
    delete:
      tags:
      - Listings
      summary: Видалити оголошення
      description: Знімає оголошення з публікації (переводить у WITHDRAWN, FR-004).
        Виконується лише власником.
      operationId: delete_listing_api_v1_listings__listing_id__delete
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /api/v1/listings/{listing_id}/contact:
    get:
      tags:
      - Contacts
      summary: Отримати контакт продавця
      description: Повертає контакт продавця активного оголошення автентифікованому
        користувачу (FR-010, SEC-002). Анонімний запит отримує 401 без контакту; неіснуюче
        або зняте оголошення — 404.
      operationId: get_seller_contact_api_v1_listings__listing_id__contact_get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerContactResponse'
        '401':
          description: Немає валідної сесії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Обліковий запис заблоковано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Оголошення не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /api/v1/favorites:
    get:
      tags:
      - Favorites
      summary: Отримати власне обране
      description: Повертає активні оголошення з обраного поточного користувача, спершу
        додані останніми (FR-009). Контакти продавців не включаються.
      operationId: get_favorites_api_v1_favorites_get
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingPublicResponse'
                title: Response Get Favorites Api V1 Favorites Get
        '401':
          description: Немає валідної сесії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Обліковий запис заблоковано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /api/v1/favorites/{listing_id}:
    post:
      tags:
      - Favorites
      summary: Додати оголошення в обране
      description: Додає активне оголошення в обране поточного користувача (FR-009).
        Повторне додавання не створює дубліката і повертає наявний запис.
      operationId: add_favorite_api_v1_favorites__listing_id__post
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
        '401':
          description: Немає валідної сесії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Обліковий запис заблоковано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
    delete:
      tags:
      - Favorites
      summary: Прибрати оголошення з обраного
      description: Видаляє оголошення з обраного поточного користувача (FR-009).
      operationId: remove_favorite_api_v1_favorites__listing_id__delete
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      responses:
        '204':
          description: Successful Response
        '401':
          description: Немає валідної сесії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Обліковий запис заблоковано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationErrorResponse'
  /api/v1/categories:
    get:
      tags:
      - Categories
      summary: Отримати список активних категорій
      description: Публічний ендпоінт для отримання списку доступних активних категорій
        для фільтрації каталогу та створення нових оголошень (FR-012).
      operationId: list_categories_api_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
                title: Response List Categories Api V1 Categories Get
    post:
      tags:
      - Categories
      summary: Створити нову категорію (Адміністратор)
      description: Адміністративний ендпоінт для створення нової категорії оголошень
        (FR-012). Вимагає валідної серверної сесії та ролі ADMIN.
      operationId: create_category_api_v1_categories_post
      parameters:
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Необхідна автентифікація (потрібен вхід через Microsoft)
        '403':
          description: Недостатньо прав доступу (потрібна роль ADMIN)
        '409':
          description: Категорія з таким slug вже існує
        '422':
          description: Невалідні поля категорії
  /api/v1/categories/{category_id}:
    get:
      tags:
      - Categories
      summary: Отримати інформацію про категорію за ID
      description: Повертає метадані конкретної категорії оголошень за її ідентифікатором
        (FR-012).
      operationId: get_category_api_v1_categories__category_id__get
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Категорію не знайдено
        '422':
          description: Некоректний формат UUID
    patch:
      tags:
      - Categories
      summary: Оновити або деактивувати категорію (Адміністратор)
      description: Адміністративний ендпоінт для зміни назви, опису або деактивації
        категорії (FR-012). Деактивована категорія зберігається в системі для збереження
        цілісності наявних оголошень. Вимагає валідної серверної сесії та ролі ADMIN.
      operationId: update_category_api_v1_categories__category_id__patch
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      - name: baraholka_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Непрозорий ID серверної сесії
          title: Baraholka Session
        description: Непрозорий ID серверної сесії
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Необхідна автентифікація (потрібен вхід через Microsoft)
        '403':
          description: Недостатньо прав доступу (потрібна роль ADMIN)
        '404':
          description: Категорію не знайдено
        '409':
          description: Новий slug вже використовується
        '422':
          description: Невалідні дані оновлення
  /api/v1/auth/login:
    get:
      tags:
      - Authentication
      summary: Розпочати вхід Microsoft Entra ID
      operationId: login_api_v1_auth_login_get
      parameters:
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          description: Внутрішній маршрут для повернення після входу
          title: Next
        description: Внутрішній маршрут для повернення після входу
      responses:
        '307':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '502':
          description: Microsoft Entra unavailable
          content:
            application/json:
              schema:
