name: Flaky test detector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-flaky-tests:
    name: Repeat full test suite five times
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked test dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-ci.lock

      - name: Run the full suite repeatedly and compare outcomes
        id: detector
        continue-on-error: true
        run: python scripts/detect_flaky_tests.py --runs 5 --results-dir flaky-test-results -- -q

      - name: Add detector report to the run summary
        if: always()
        run: cat flaky-test-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-results-${{ github.sha }}
          path: flaky-test-results/
          if-no-files-found: error

      - name: Fail when a run failed or an inconsistent test was found
        if: steps.detector.outcome == 'failure'
        run: exit 1
