name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format check (Black)
        run: black --check src tests scripts

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Security scan (Bandit)
        run: bandit -r src -ll -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Generate OpenAPI spec
        run: python scripts/generate_openapi.py

      - name: Check committed spec is up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/api/openapi-generated.yaml)" ]; then
            echo "openapi-generated.yaml застарів. Запустіть python scripts/generate_openapi.py і закомітьте файл."
            git diff -- docs/api/openapi-generated.yaml
            exit 1
          fi