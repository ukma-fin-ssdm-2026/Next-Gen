name: CI

# Швидкий набір (`test`, `Reliability tests`) запускається на кожному PR і push у
# `main`. Повільний набір з реальним PostgreSQL 16 (`postgres-migration`)
# запускається лише після злиття в `main` або вручну (workflow_dispatch),
# щоб кожен push у PR не займав ще один спільний раннер курсу (Lab 10, бонус 3).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Isolate groups by PR. A unique run group for main and manual runs keeps
# every delivery check and independently requested run eligible to finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock"

      - name: Alembic single head (no database)
        # Дві голови міграцій ламають `alembic upgrade head`; без БД це видно
        # ще в PR, хоча повна перевірка PostgreSQL іде лише після злиття.
        run: |
          heads="$(python -m alembic heads | wc -l)"
          echo "Alembic heads: ${heads}"
          test "${heads}" -eq 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Format check (Black)
        run: black --check src tests scripts

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Security scan (Bandit)
        run: bandit -r src -ll -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests with coverage gate (85%)
        run: pytest -q -m "not performance" --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=85

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Покриття тестами"
            echo
            coverage report --format=markdown
            echo
            echo "Повний HTML-звіт: артефакт \`htmlcov\` цього прогону."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

      - name: Generate OpenAPI spec
        run: python scripts/generate_openapi.py

      - name: Check committed spec is up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/api/openapi-generated.yaml)" ]; then
            echo "openapi-generated.yaml застарів. Запустіть python scripts/generate_openapi.py і закомітьте файл."
            git diff -- docs/api/openapi-generated.yaml
            exit 1
          fi

  postgres-migration:
    name: Alembic migration check (PostgreSQL 16)
    # Повільний набір: після злиття в main або вручну, але не на pull_request.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baraholka_test
          POSTGRES_USER: baraholka
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://baraholka:testpassword@localhost:5432/baraholka_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.lock -r requirements-test.lock

      - name: Run Alembic upgrade head
        run: python -m alembic upgrade head

      - name: Run Alembic check (schema drift)
        run: python -m alembic check

      - name: Run Alembic downgrade base
        run: python -m alembic downgrade base

      - name: Run Alembic upgrade head again (round-trip)
        run: python -m alembic upgrade head

      - name: Run integration tests against PostgreSQL
        run: pytest tests/test_postgres_repositories.py tests/test_postgres_moderation.py tests/reliability/test_database_reliability.py -v --tb=short

      - name: Verify committed listings after an abrupt PostgreSQL restart (REL-001)
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: timeout 300s python -m scripts.verify_postgres_recovery

  reliability-tests:
    name: Reliability tests
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock"

      - name: Run reliability tests (fault injection, boundary, error handling)
        run: pytest -q tests/reliability/ -v --tb=short
