name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format check (Black)
        run: black --check src tests scripts

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Security scan (Bandit)
        run: bandit -r src -ll -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests with coverage gate (85%)
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=85

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Покриття тестами"
            echo
            coverage report --format=markdown
            echo
            echo "Повний HTML-звіт: артефакт \`htmlcov\` цього прогону."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

      - name: Generate OpenAPI spec
        run: python scripts/generate_openapi.py

      - name: Check committed spec is up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/api/openapi-generated.yaml)" ]; then
            echo "openapi-generated.yaml застарів. Запустіть python scripts/generate_openapi.py і закомітьте файл."
            git diff -- docs/api/openapi-generated.yaml
            exit 1
          fi

  postgres-migration:
    name: Alembic migration check (PostgreSQL 16)
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baraholka_test
          POSTGRES_USER: baraholka
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://baraholka:testpassword@localhost:5432/baraholka_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.lock -r requirements-test.lock

      - name: Run Alembic upgrade head
        run: python -m alembic upgrade head

      - name: Run Alembic check (schema drift)
        run: python -m alembic check

      - name: Run Alembic downgrade base
        run: python -m alembic downgrade base

      - name: Run Alembic upgrade head again (round-trip)
        run: python -m alembic upgrade head

      - name: Run integration tests against PostgreSQL
        run: pytest tests/test_postgres_repositories.py tests/test_postgres_moderation.py -v --tb=short