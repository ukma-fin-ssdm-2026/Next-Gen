services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baraholka}
      POSTGRES_USER: ${POSTGRES_USER:-baraholka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт PostgreSQL НЕ публікується на зовнішньому інтерфейсі (вимога безпеки)
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-baraholka} -d ${POSTGRES_DB:-baraholka}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads_data:/var/lib/baraholka/uploads
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}
      - traefik.http.routers.baraholka-http.rule=Host(`${BARAHOLKA_HOST:?Set BARAHOLKA_HOST in .env}`)
      - traefik.http.routers.baraholka-http.entrypoints=web
      - traefik.http.routers.baraholka-http.middlewares=baraholka-https
      - traefik.http.middlewares.baraholka-https.redirectscheme.scheme=https
      - traefik.http.middlewares.baraholka-https.redirectscheme.permanent=true
      - traefik.http.routers.baraholka.rule=Host(`${BARAHOLKA_HOST:?Set BARAHOLKA_HOST in .env}`)
      - traefik.http.routers.baraholka.entrypoints=websecure
      - traefik.http.routers.baraholka.tls=true
      - traefik.http.routers.baraholka.tls.certresolver=letsencrypt
      - traefik.http.services.baraholka.loadbalancer.server.port=8000
    networks:
      - proxy
      - internal

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}
  internal:
    internal: true

volumes:
  postgres_data:
  uploads_data:
